name: Build Magisk Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build overlay APK
        run: gradle --no-daemon :overlay:assembleRelease

      - name: Assemble Magisk ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/rounded_screen_corners_20dp/system/product/overlay
          cp module/module.prop out/rounded_screen_corners_20dp/module.prop
          cp module/service.sh out/rounded_screen_corners_20dp/service.sh
          cp module/uninstall.sh out/rounded_screen_corners_20dp/uninstall.sh
          cp overlay/build/outputs/apk/release/overlay-release.apk out/rounded_screen_corners_20dp/system/product/overlay/RoundedScreenCorners20dp.apk
          chmod 0755 out/rounded_screen_corners_20dp/service.sh out/rounded_screen_corners_20dp/uninstall.sh
          (cd out/rounded_screen_corners_20dp && zip -qr ../Rounded-Screen-Corners-20dp-Magisk.zip .)

      - name: Validate artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=overlay/build/outputs/apk/release/overlay-release.apk
          test -s "$APK"
          test -s out/Rounded-Screen-Corners-20dp-Magisk.zip
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources "$APK" | grep -E 'rounded_corner_radius(_top|_bottom)?'
          unzip -l out/Rounded-Screen-Corners-20dp-Magisk.zip

      - name: Upload Magisk ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Rounded-Screen-Corners-20dp-Magisk
          path: out/Rounded-Screen-Corners-20dp-Magisk.zip
          if-no-files-found: error
          retention-days: 30
