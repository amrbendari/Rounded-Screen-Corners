plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amrbendari.roundedscreencorners.overlay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.amrbendari.roundedscreencorners.overlay'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.1-test'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Temporary test signing. Replace with a stable release key before public release.
            signingConfig signingConfigs.debug
        }
    }
}
